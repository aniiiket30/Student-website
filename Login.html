<!DOCTYPE html>
<html>
    <head>
        <title>Student Website</title>
        <link rel= "stylesheet" href="style.css">
    </head>
    <body>
      <nav>
            <a class="myclass" href="index.html">Home</a>
            <a class="myclass" href="Video.html">Videos</a>
            <a class="myclass" href="Login.html">Login</a>
        </nav><br>
        <form>
           <b class="bold2">Your First Name:-</b> <input class="input1" type="text" placeholder="Enter 1st Name"><br><br>
           <b class="bold2">Enter Your last Name:-</b><input class="input1" type="text" placeholder="Enter Last Name"><br><br>
           <b class="bold2">Enter Address:-</b><br><textarea name="Address" id="feedback" placeholder="Enter Your Address"></textarea><br><br>
           <b class="bold2">Choose Your Class</b><br>
          <label for="id1">
            <b class="bold3">Class XI</b><input type="radio" value="class XI" name="class" id="id1">
          </label><br>
          <label for="id2">
            <b class="bold3">Class XII</b><input type="radio" value="class XII" name="class" id="id2">
          </label><br><br>
           <b class="bold2">Coding Language</b><br>
          <label for="id1">
            <b class="bold3">JAVA</b><input type="checkbox" value="JAVA" name="class" id="id1">
          </label><br>
          <label for="id2">
            <b class="bold3">C++</b><input type="checkbox" value="C++" name="class" id="id2">
          </label><br>
          <label for="id3">
            <b class="bold3">Python</b><input type="checkbox" value="Python" name="class" id="id3">
          </label><br><br>
          <b class="bold2">Choose Hobbies</b><select>
            <option>Playing</option>
            <option>Singing</option>
            <option>Dancing</option>
          </select><br><br>
          <fieldset>
            <legend><b class="bold2">Personal Info</b></legend>
            <b class="bold2">Email:</b><input type="text" placeholder="Enter Email"><br>
            <b class="bold2">Password:</b><input type="password" placeholder="Enter Password"><br>
            <b class="bold2">Confirm Password:</b><input type="password" placeholder="Confirm Password"><br>
          </fieldset><br>
          <button id="button1">Submit</button>
        </form>
    </body>
</html>
