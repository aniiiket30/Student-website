<!DOCTYPE html>
<html>
    <head>
        <title>Student Website</title>
    </head>
    <body>
      <nav>
            <a href="index.html">Home</a>
            <a href="Video.html">Videos</a>
            <a href="Login.html">Login</a>
        </nav><br>
        <form>
           Enter Your Fisrt Name:-<input type="text" placeholder="Enter 1st Name"><br><br>
           Enter Your last Name:-<input type="text" placeholder="Enter Last Name"><br><br>
           Enter Address:-<br><textarea name="Address" id="feedback" placeholder="Enter Your Address"></textarea><br><br>
           Choose Your Class<br>
          <label for="id1">
            Class XI<input type="radio" value="class XI" name="class" id="id1">
          </label><br>
          <label for="id2">
            Class XII<input type="radio" value="class XII" name="class" id="id2">
          </label><br><br>
           Choose Coding Language<br>
          <label for="id1">
            JAVA<input type="checkbox" value="JAVA" name="class" id="id1">
          </label><br>
          <label for="id2">
            C++<input type="checkbox" value="C++" name="class" id="id2">
          </label><br>
          <label for="id3">
            Python<input type="checkbox" value="Python" name="class" id="id3">
          </label><br><br>
          Choose Hobbies<select>
            <option>Playing</option>
            <option>Singing</option>
            <option>Dancing</option>
          </select><br><br>
          <fieldset>
            <legend>Personal Info</legend>
            Email:<input type="text" placeholder="Enter Email"><br>
            Password:<input type="password" placeholder="Enter Password"><br>
            Confirm Password:<input type="password" placeholder="Confirm Password"><br>
          </fieldset><br>
          <button>Submit</button>
        </form>
    </body>
</html>
